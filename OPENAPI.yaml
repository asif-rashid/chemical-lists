```yaml
openapi: 3.0.3
info:
  title: Chemical List Management API
  description: |
    REST API to create and manage chemical lists and associate chemicals (by CIRI-ID).
    - **Reads** are public (no authentication).
    - **Writes** (POST, PATCH, DELETE) require authentication via **API Key** (`x-api-key`) or **OIDC (Azure Entra ID)** depending on deployment profile.
    - Error responses use **Problem Details** (RFC 9457) with `application/problem+json`.

    **Notes**
    - Redis is the system of record (Azure Cache for Redis with AOF).
    - `label` is globally unique across lists.
    - Batch add accepts a JSON array of CIRI-IDs (array-of-strings).
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.example.org
    description: Production (placeholder)
tags:
  - name: Lists
    description: Manage chemical lists (metadata)
  - name: Chemicals
    description: Manage chemicals within a list
paths:
  /lists:
    get:
      tags: [Lists]
      summary: Get all lists
      description: Returns all list metadata. Public endpoint; no authentication required.
      operationId: getLists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChemicalList'
              examples:
                sample:
                  value:
                    - listId: 101
                      label: indsolv
                      name: Industrial Solvents
                      description: List of regulated industrial solvents
                      createdBy: asif
                      createdDate: "2025-11-11T18:30:00Z"
                      lastUpdatedBy: asif
                      lastUpdated: "2025-11-11T18:30:00Z"
                    - listId: 102
                      label: labchem
                      name: Laboratory Chemicals
                      description: Common lab chemicals
                      createdBy: steve
                      createdDate: "2025-11-11T18:45:00Z"
                      lastUpdatedBy: steve
                      lastUpdated: "2025-11-11T18:45:00Z"
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Lists]
      summary: Create a new list
      description: |
        Creates a new chemical list. Requires authentication (API key or OIDC depending on deployment profile).
        - `label` must be unique.
        - Supports optional `Idempotency-Key` header.
      operationId: createList
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChemicalListCreate'
            examples:
              create:
                value:
                  label: indsolv
                  name: Industrial Solvents
                  description: List of regulated industrial solvents
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the newly created list resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChemicalList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflict (e.g., label already exists)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/Problem'
      security:
        - ApiKeyAuth: []
        - OpenID: []
  /lists/{listId}:
    get:
      tags: [Lists]
      summary: Get list by ID
      description: Returns metadata for a specific list. Public endpoint; no authentication required.
      operationId: getListById
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChemicalList'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Lists]
      summary: Update list metadata
      description: |
        Partially update list metadata. Requires authentication.
        - Only `name`, `label`, and `description` are patchable.
        - Changing `label` must preserve uniqueness.
        - Supports optional `Idempotency-Key` header.
      operationId: updateList
      parameters:
        - $ref: '#/components/parameters/ListId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChemicalListUpdate'
            examples:
              patch:
                value:
                  name: "Industrial Solvents (Updated)"
                  description: "Updated description"
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChemicalList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict (e.g., new label already exists)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        default:
          $ref: '#/components/responses/Problem'
      security:
        - ApiKeyAuth: []
        - OpenID: []
    delete:
      tags: [Lists]
      summary: Delete a list
      description: Deletes a list and its chemicals. Requires authentication.
      operationId: deleteList
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '204':
          description: No Content (deleted)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
      security:
        - ApiKeyAuth: []
        - OpenID: []
  /lists/{listId}/chemicals:
    get:
      tags: [Chemicals]
      summary: Get chemicals for a list
      description: Returns all CIRI-IDs associated with a list. Public endpoint; no authentication required.
      operationId: getListChemicals
      parameters:
        - $ref: '#/components/parameters/ListId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CiriIdArray'
              examples:
                sample:
                  value: ["CIRI-000001", "CIRI-000002", "CIRI-000003"]
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Chemicals]
      summary: Add one or more chemicals to a list
      description: |
        Adds one or many chemicals to the list using CIRI-IDs. Requires authentication.
        - Request body is a **JSON array of strings** (`["CIRI-..."]`).
        - Operation is idempotent; duplicates are ignored.
        - Supports optional `Idempotency-Key` header.
      operationId: addChemicals
      parameters:
        - $ref: '#/components/parameters/ListId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CiriIdArray'
            examples:
              one:
                value: ["CIRI-000123"]
              many:
                value: ["CIRI-000001", "CIRI-000002", "CIRI-000003"]
      responses:
        '200':
          description: Added (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
              examples:
                result:
                  value:
                    added: ["CIRI-000001", "CIRI-000003"]
                    skipped: ["CIRI-000002"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
      security:
        - ApiKeyAuth: []
        - OpenID: []
  /lists/{listId}/chemicals/{ciriId}:
    delete:
      tags: [Chemicals]
      summary: Remove a chemical from a list
      description: Removes a specific chemical (by CIRI-ID) from the list. Requires authentication.
      operationId: removeChemical
      parameters:
        - $ref: '#/components/parameters/ListId'
        - $ref: '#/components/parameters/CiriId'
      responses:
        '204':
          description: No Content (removed or already absent)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
      security:
        - ApiKeyAuth: []
        - OpenID: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key required for write operations when running in `apikey` profile.
    OpenID:
      type: openIdConnect
      openIdConnectUrl: https://login.microsoftonline.com/{tenant-id}/v2.0
      description: OIDC (Azure Entra ID) for write operations when running in `oidc` profile.
  parameters:
    ListId:
      name: listId
      in: path
      required: true
      description: Numeric system-generated list ID
      schema:
        type: integer
        format: int64
        minimum: 1
      examples:
        ex:
          value: 101
    CiriId:
      name: ciriId
      in: path
      required: true
      description: CIRI-ID string
      schema:
        type: string
        minLength: 1
      examples:
        ex:
          value: CIRI-000001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Optional idempotency key to safely retry write requests.
      schema:
        type: string
  responses:
    Problem:
      description: Problem Details error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            bad:
              value:
                type: "https://api.example.org/errors/bad-request"
                title: "Bad Request"
                status: 400
                detail: "Invalid payload."
                instance: "/lists"
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauth:
              value:
                type: "https://api.example.org/errors/unauthorized"
                title: "Missing or invalid credentials"
                status: 401
                detail: "x-api-key header missing."
                instance: "/lists"
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            forb:
              value:
                type: "https://api.example.org/errors/forbidden"
                title: "Forbidden"
                status: 403
                detail: "Credentials provided but not permitted."
                instance: "/lists"
    NotFound:
      description: Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            nf:
              value:
                type: "https://api.example.org/errors/not-found"
                title: "Not Found"
                status: 404
                detail: "List not found."
                instance: "/lists/9999"
  schemas:
    ChemicalList:
      type: object
      required: [listId, label, name, createdBy, createdDate, lastUpdatedBy, lastUpdated]
      properties:
        listId:
          type: integer
          format: int64
          example: 101
        label:
          type: string
          maxLength: 30
          example: indsolv
          description: Unique short identifier for the list
        name:
          type: string
          maxLength: 200
          example: Industrial Solvents
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: List of regulated industrial solvents
        createdBy:
          type: string
          example: asif
        createdDate:
          type: string
          format: date-time
          example: "2025-11-11T18:30:00Z"
        lastUpdatedBy:
          type: string
          example: asif
        lastUpdated:
          type: string
          format: date-time
          example: "2025-11-11T18:30:00Z"
    ChemicalListCreate:
      type: object
      required: [label, name]
      properties:
        label:
          type: string
          maxLength: 30
          example: indsolv
        name:
          type: string
          maxLength: 200
          example: Industrial Solvents
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: List of regulated industrial solvents
    ChemicalListUpdate:
      type: object
      properties:
        label:
          type: string
          maxLength: 30
          example: indsolv2
        name:
          type: string
          maxLength: 200
          example: Industrial Solvents (Updated)
        description:
          type: string
          maxLength: 2000
          nullable: true
          example: Updated description
      description: At least one field must be provided.
    CiriIdArray:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
      example: ["CIRI-000001", "CIRI-000002"]
    BatchResult:
      type: object
      properties:
        added:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: string
      required: [added, skipped]
      example:
        added: ["CIRI-000001", "CIRI-000003"]
        skipped: ["CIRI-000002"]
    ProblemDetails:
      type: object
      description: Problem Details (RFC 9457 / 7807 compatible)
      properties:
        type:
          type: string
          format: uri
          example: "https://api.example.org/errors/bad-request"
        title:
          type: string
          example: "Bad Request"
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: "Invalid payload."
        instance:
          type: string
          example: "/lists"
      required: [title, status]
security:
  - {}   # Public by default; specific operations declare security when required
```
